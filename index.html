<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GrammarCorrect - AI Proofreading & Summary Assistant</title>
    
    <!-- Open Graph & Meta Tags -->

    <link rel="icon" type="image/svg+xml" href="https://icons.getbootstrap.com/assets/icons/spellcheck.svg">

        darkMode: 'class',

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Editor Issue Highlights */
      .issue-highlight {
        position: relative;
        border-bottom-width: 2.5px;
        border-bottom-style: solid;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.15s ease-in-out;
        padding: 1px 3px;
      }

      .issue-highlight.type-grammar {
        background-color: rgba(254, 226, 226, 0.75);
        border-bottom-color: #ef4444;
      }
      .issue-highlight.type-grammar:hover, .issue-highlight.active-target.type-grammar {
        background-color: #fca5a5;
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
      }

      .issue-highlight.type-warning {
        background-color: rgba(254, 243, 199, 0.85);
        border-bottom-color: #f59e0b;
      }
      .issue-highlight.type-warning:hover, .issue-highlight.active-target.type-warning {
        background-color: #fde68a;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
      }

      .issue-highlight.type-style {
        background-color: rgba(224, 231, 255, 0.75);
        border-bottom-color: #6366f1;
      }
      .issue-highlight.type-style:hover, .issue-highlight.active-target.type-style {
        background-color: #c7d2fe;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);

      /* Dark Mode Highlights */

        background-color: rgba(239, 68, 68, 0.25);
        border-bottom-color: #f87171;
      }
      .dark .issue-highlight.type-grammar:hover, .dark .issue-highlight.active-target.type-grammar {
        background-color: rgba(239, 68, 68, 0.45);
      }

      .dark .issue-highlight.type-warning {
        background-color: rgba(245, 158, 11, 0.25);
        border-bottom-color: #fbbf24;
      }
      .dark .issue-highlight.type-warning:hover, .dark .issue-highlight.active-target.type-warning {
        background-color: rgba(245, 158, 11, 0.45);
      }

      .dark .issue-highlight.type-style {
        background-color: rgba(99, 102, 241, 0.25);
        border-bottom-color: #818cf8;
      }
      .dark .issue-highlight.type-style:hover, .dark .issue-highlight.active-target.type-style {
        background-color: rgba(99, 102, 241, 0.45);
      }

      /* Editable Workspace Formatting */
      #editor-content {
        outline: none;
        white-space: pre-wrap;
        word-wrap: break-word;
        min-height: 100%;
        -webkit-user-modify: read-write-plaintext-only;
      }

      #editor-content[placeholder]:empty:before {
        content: attr(placeholder);
        color: #9ca3af;
        pointer-events: none;
        display: block;
      }
      .dark #editor-content[placeholder]:empty:before {
        color: #6b7280;
      }

      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.95) translateY(4px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-pop-in {
        animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const OPFS_FILE_NAME = "grammarcorrect_draft.txt";

      const saveToOPFS = async (content) => {
        try {
          if ('storage' in navigator && 'getDirectory' in navigator.storage) {
            const root = await navigator.storage.getDirectory();
            const fileHandle = await root.getFileHandle(OPFS_FILE_NAME, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            return true;
          }
        } catch (err) {
          console.warn("OPFS write fallback to localStorage:", err);
        }
        try {
          localStorage.setItem(OPFS_FILE_NAME, content);
        } catch(e) {}
        return false;
      };

      const loadFromOPFS = async () => {
        try {
          if ('storage' in navigator && 'getDirectory' in navigator.storage) {
            const root = await navigator.storage.getDirectory();
            const fileHandle = await root.getFileHandle(OPFS_FILE_NAME, { create: false });
            const file = await fileHandle.getFile();
            return await file.text();
          }
        } catch (err) {}
        try {
          return localStorage.getItem(OPFS_FILE_NAME) || "";
        } catch(e) {
          return "";
        }
      };

      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      const API_KEY = ""; // System injected dynamically at runtime
      
      const DEFAULT_SETTINGS = {
        darkMode: false,
        tone: 'Professional',
        apiKey: '',
        model: 'gemini-3.5-flash-lite'
      };

      const MODEL_OPTIONS = (

            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>

            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Preview)</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
          </optgroup>
          <optgroup label="Google Gemma Models (AI Studio)">
            <option value="gemma-4-31b-it">Gemma 4 31B Instruct</option>
            <option value="gemma-4-12b-it">Gemma 4 12B Instruct</option>
            <option value="gemma-3-27b-it">Gemma 3 27B Instruct</option>
            <option value="gemma-3-4b-it">Gemma 3 4B Instruct</option>
            <option value="gemma-2-27b-it">Gemma 2 27B Instruct</option>
          </optgroup>
        </>

      const Icons = {

        ),
        Sparkles: () => (

          </svg>

        ArrowRight: () => (
          <svg xmlns="http://www.w3.org/2000/svg" className="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        ),
        SidebarToggle: () => (
          <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h7" />
          </svg>
        ),
        DocumentText: () => (
          <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        ),
        Cog: ({ className = "h-4 w-4" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        )
      };

      const processAndDeduplicateIssues = (rawIssues, fullText) => {
        if (!rawIssues || !Array.isArray(rawIssues) || !fullText) return [];

        const processed = [];
        const seenKeys = new Set();
        const textSearchCursors = {};

        rawIssues.forEach((issue, index) => {
          if (!issue.originalText || typeof issue.originalText !== 'string') return;
          
          const orig = issue.originalText.trim();
          if (!orig) return;

          const issueKey = `${orig}__${issue.suggestion}__${issue.type}`;
          if (seenKeys.has(issueKey)) return;

          const startFrom = textSearchCursors[orig] || 0;
          const foundIdx = fullText.indexOf(orig, startFrom);

          if (foundIdx !== -1) {
            const endIdx = foundIdx + orig.length;
            textSearchCursors[orig] = endIdx;

            const overlaps = processed.some(p => 
              (foundIdx >= p.startIndex && foundIdx < p.endIndex) ||
              (endIdx > p.startIndex && endIdx <= p.endIndex)
            );

            if (!overlaps) {
              seenKeys.add(issueKey);
              processed.push({
                ...issue,
                id: issue.id || `issue-${index}-${Date.now()}`,
                originalText: orig,
                suggestion: issue.suggestion || '',
                explanation: issue.explanation || 'Suggested improvement.',
                type: issue.type === 'grammar' ? 'grammar' : 'style',
                severity: issue.severity || 'medium',
                startIndex: foundIdx,
                endIndex: endIdx
              });
            }
          }
        });

        return processed.sort((a, b) => a.startIndex - b.startIndex);
      };

      const App = () => {
        const [settings, setSettings] = useState(() => {
          try {
            const saved = localStorage.getItem('grammarcorrect_settings');
            return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
          } catch (e) {
            return DEFAULT_SETTINGS;
          }
        });

        const [text, setText] = useState("");
        const [isStorageLoaded, setIsStorageLoaded] = useState(false);
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const [isSummarizing, setIsSummarizing] = useState(false);
        const [results, setResults] = useState(null);
        const [summaryData, setSummaryData] = useState(null);
        const [activeTab, setActiveTab] = useState('all'); // 'all', 'grammar', 'style', 'summary', 'settings'
        const [error, setError] = useState("");
        const [copied, setCopied] = useState(false);
        
        // Starts closed on first load
        const [sidebarOpen, setSidebarOpen] = useState(false);

        // Floating Tooltip State
        const [activeTooltip, setActiveTooltip] = useState(null);

        const editorRef = useRef(null);

        // Load initial text from OPFS file system on mount
        useEffect(() => {
          loadFromOPFS().then((opfsText) => {
            const initialContent = opfsText !== "" ? opfsText : 
              "Her is a sample text with several errors. We is going to testing this grammar checker to see how it can improves your writing style, tone and clarity. Furthermore, the quick brown fox jumps over the lazy dog and this text is very repetitive and overly long.";
            setText(initialContent);
            setIsStorageLoaded(true);
            if (editorRef.current) {
              editorRef.current.innerText = initialContent;
            }
          });
        }, []);

        // Save settings to LocalStorage
        useEffect(() => {
          try {
            localStorage.setItem('grammarcorrect_settings', JSON.stringify(settings));
          } catch (e) {}
        }, [settings]);

        // Save text to OPFS whenever text changes
        useEffect(() => {
          if (isStorageLoaded) {
            saveToOPFS(text);
          }
        }, [text, isStorageLoaded]);

        // Dark Mode toggle
        useEffect(() => {
          if (settings.darkMode) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }, [settings.darkMode]);

        const dynamicScore = useMemo(() => {
          if (!results) return null;
          const remainingCount = results.issues ? results.issues.length : 0;
          if (remainingCount === 0) return 100;
          
          const initialTotal = results.initialIssuesCount || remainingCount;
          const initialScore = results.initialScore !== undefined ? results.initialScore : (results.overallScore || 80);
          
          if (initialTotal <= 0) return 100;
          
          const fixedCount = Math.max(0, initialTotal - remainingCount);
          const calculatedScore = Math.round(initialScore + (100 - initialScore) * (fixedCount / initialTotal));
          return Math.min(100, Math.max(0, calculatedScore));
        }, [results]);

        const handleEditorInput = (e) => {
          const plainText = e.currentTarget.innerText;
          setText(plainText);
          setActiveTooltip(null);

          // Reset results if text is completely emptied
          if (!plainText.trim()) {
            setResults(null);
            setSummaryData(null);
          }
        };

        const analyzeText = async (overrideText = null) => {
          const textToAnalyze = overrideText !== null ? overrideText : text;
          
          if (!textToAnalyze.trim()) {
            setError("Please enter some text to analyze.");
            return;
          }

          setIsAnalyzing(true);
          setError("");
          setActiveTooltip(null);

          const keyToUse = API_KEY || settings.apiKey;
          const selectedModel = settings.model || 'gemini-3.5-flash-lite';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${keyToUse}`;

          const systemInstruction = `You are a world-class proofreader and grammar editor (like Grammarly).
Analyze the entire provided text comprehensively for spelling, grammar, punctuation, conciseness, and tone fit.
Desired Writing Tone: ${settings.tone || 'Professional'}.

Instructions:
1. "originalText" MUST be an exact substring present in the input text.
2. Provide precise, actionable "suggestion" replacements.
3. Categorize into "grammar" (correctness, spelling, punctuation) or "style" (clarity, conciseness, tone).
4. Be accurate, scan the entire text, and return all identified issues without missing any.

Return ONLY a valid JSON object with this exact structure:
{
  "overallScore": number (0-100 score),
  "summary": "1-2 sentence overview of writing quality",
  "issues": [
    {
      "id": "unique-id-1",
      "type": "grammar" or "style",
      "originalText": "exact substring from input",
      "suggestion": "replacement text",
      "explanation": "clear 1-sentence reason",
      "severity": "high" or "medium" or "low"
    }
  ]
}`;

          const payload = {
            contents: [{
              role: "user",
              parts: [{ text: textToAnalyze }]
            }],
            systemInstruction: {
              parts: [{ text: systemInstruction }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.1
            }
          };

          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.error?.message || `API Request failed (${response.status})`);
            }

            const data = await response.json();
            
            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
              const rawJson = data.candidates[0].content.parts[0].text;
              const parsedData = JSON.parse(rawJson);
              
              const processedIssues = processAndDeduplicateIssues(parsedData.issues, textToAnalyze);
              
              const finalResult = {
                ...parsedData,
                issues: processedIssues,
                initialIssuesCount: processedIssues.length,
                initialScore: parsedData.overallScore || 80
              };

              setResults(finalResult);
              renderHighlights(textToAnalyze, processedIssues);
              
              // Smoothly display findings
              setSidebarOpen(true);
            } else {
              throw new Error("No response generated from AI.");
            }
          } catch (err) {
            console.error("Analysis Error:", err);
            setError(err.message || "Failed to analyze text. Please verify your connection or model settings.");
          } finally {
            setIsAnalyzing(false);
          }
        };

        const generateSummary = async () => {
          if (!text.trim()) {
            setError("Please enter text to summarize.");
            return;
          }

          setIsSummarizing(true);
          setError("");
          setActiveTab('summary');
          setSidebarOpen(true);

          const keyToUse = API_KEY || settings.apiKey;
          const selectedModel = settings.model || 'gemini-3.5-flash-lite';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${keyToUse}`;

          const systemInstruction = `You are an expert executive editor. Summarize the user's text into clear insights.
Return ONLY a valid JSON object with this exact structure:
{
  "executiveSummary": "2-3 sentence overall executive summary",
  "keyTakeaways": ["Bullet point 1", "Bullet point 2", "Bullet point 3"],
  "estimatedReadingTime": "X mins",
  "sentiment": "Positive / Neutral / Professional / Direct"
}`;

          const payload = {
            contents: [{
              role: "user",
              parts: [{ text: text }]
            }],
            systemInstruction: {
              parts: [{ text: systemInstruction }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.2
            }
          };

          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`Summary request failed (${response.status})`);
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
              const parsedSummary = JSON.parse(data.candidates[0].content.parts[0].text);
              setSummaryData(parsedSummary);
            }
          } catch (err) {
            console.error("Summary Error:", err);
            setError(err.message || "Failed to generate summary.");
          } finally {
            setIsSummarizing(false);
          }
        };

        const renderHighlights = (rawText, issuesList) => {
          if (!editorRef.current) return;

          if (!issuesList || issuesList.length === 0) {
            editorRef.current.innerText = rawText;
            return;
          }

          let htmlBuffer = "";
          let currentIdx = 0;

          issuesList.forEach((issue) => {
            const textBefore = rawText.substring(currentIdx, issue.startIndex);
            htmlBuffer += escapeHtml(textBefore);

            let typeClass = issue.type === 'grammar' 
              ? (issue.severity === 'high' ? 'type-grammar' : 'type-warning') 
              : 'type-style';

            const highlightedSpan = rawText.substring(issue.startIndex, issue.endIndex);
            
            htmlBuffer += `<span class="issue-highlight ${typeClass}" data-issue-id="${issue.id}">${escapeHtml(highlightedSpan)}</span>`;

            currentIdx = issue.endIndex;
          });

          htmlBuffer += escapeHtml(rawText.substring(currentIdx));
          editorRef.current.innerHTML = htmlBuffer;
        };

        const escapeHtml = (str) => {
          return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        };

        const handleEditorClick = (e) => {
          const targetSpan = e.target.closest('.issue-highlight');
          if (targetSpan && results && results.issues) {
            const issueId = targetSpan.getAttribute('data-issue-id');
            const issue = results.issues.find(i => i.id === issueId);
            
            if (issue) {
              const rect = targetSpan.getBoundingClientRect();
              document.querySelectorAll('.issue-highlight').forEach(el => el.classList.remove('active-target'));
              targetSpan.classList.add('active-target');

              const tooltipWidth = Math.min(320, window.innerWidth - 32);
              const leftPos = Math.min(Math.max(rect.left + window.scrollX, 16), window.innerWidth - tooltipWidth - 16);

              setActiveTooltip({
                issueId,
                issue,
                top: rect.bottom + window.scrollY + 6,
                left: leftPos
              });
              return;
            }
          }
          
          document.querySelectorAll('.issue-highlight').forEach(el => el.classList.remove('active-target'));
          setActiveTooltip(null);
        };

        const acceptSuggestion = (issueId) => {
          if (!results) return;

          const targetIssue = results.issues.find(i => i.id === issueId);
          if (!targetIssue) return;

          const before = text.substring(0, targetIssue.startIndex);
          const after = text.substring(targetIssue.endIndex);
          const newFullText = before + targetIssue.suggestion + after;

          const offsetDelta = targetIssue.suggestion.length - (targetIssue.endIndex - targetIssue.startIndex);

          setText(newFullText);

          const remainingIssues = results.issues
            .filter(i => i.id !== issueId)
            .map(i => {
              if (i.startIndex > targetIssue.startIndex) {
                return {
                  ...i,
                  startIndex: i.startIndex + offsetDelta,
                  endIndex: i.endIndex + offsetDelta
                };
              }
              return i;
            });

          setResults({
            ...results,
            issues: remainingIssues
          });

          setActiveTooltip(null);
          renderHighlights(newFullText, remainingIssues);
        };

        const dismissIssue = (issueId) => {
          if (!results) return;

          const remainingIssues = results.issues.filter(i => i.id !== issueId);
          setResults({
            ...results,
            issues: remainingIssues
          });

          setActiveTooltip(null);
          renderHighlights(text, remainingIssues);
        };

        const acceptAllFiltered = () => {
          if (!results || !results.issues || results.issues.length === 0) return;

          const issuesToApply = results.issues.filter(i => {
            if (activeTab === 'grammar') return i.type === 'grammar';
            if (activeTab === 'style') return i.type === 'style';
            return true;
          });

          if (issuesToApply.length === 0) return;

          const sortedDesc = [...issuesToApply].sort((a, b) => b.startIndex - a.startIndex);
          
          let currentText = text;
          const appliedIds = new Set();

          sortedDesc.forEach(issue => {
            const before = currentText.substring(0, issue.startIndex);
            const after = currentText.substring(issue.endIndex);
            currentText = before + issue.suggestion + after;
            appliedIds.add(issue.id);
          });

          setText(currentText);

          const remaining = results.issues.filter(i => !appliedIds.has(i.id));
          const reProcessed = processAndDeduplicateIssues(remaining, currentText);

          setResults({
            ...results,
            issues: reProcessed
          });

          setActiveTooltip(null);
          renderHighlights(currentText, reProcessed);
        };

        const clearText = () => {
          setText("");
          setResults(null);
          setSummaryData(null);
          setActiveTooltip(null);
          if (editorRef.current) editorRef.current.innerText = "";
        };

        const copyTextToClipboard = () => {
          const plain = editorRef.current ? editorRef.current.innerText : text;
          navigator.clipboard.writeText(plain).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          });
        };

        const scrollToIssueInEditor = (issue) => {
          if (!editorRef.current) return;
          
          const el = editorRef.current.querySelector(`[data-issue-id="${issue.id}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.querySelectorAll('.issue-highlight').forEach(span => span.classList.remove('active-target'));
            el.classList.add('active-target');

            try {
              const selection = window.getSelection();
              const range = document.createRange();
              range.selectNodeContents(el);
              selection.removeAllRanges();
              selection.addRange(range);
            } catch (e) {}

            const rect = el.getBoundingClientRect();
            const tooltipWidth = Math.min(320, window.innerWidth - 32);
            const leftPos = Math.min(Math.max(rect.left + window.scrollX, 16), window.innerWidth - tooltipWidth - 16);

            setActiveTooltip({
              issueId: issue.id,
              issue,
              top: rect.bottom + window.scrollY + 6,
              left: leftPos
            });

            // Auto dismiss mobile drawer when jumping to word
            if (window.innerWidth < 1024) {
              setSidebarOpen(false);
            }
          }
        };

        const metrics = useMemo(() => {
          const cleanText = text.trim();
          if (!cleanText) {
            return { words: 0, chars: 0, readingTime: 0, total: 0, grammar: 0, style: 0 };
          }

          const words = cleanText.split(/\s+/).filter(w => w.length > 0).length;
          const chars = text.length;
          const readingTime = Math.max(1, Math.ceil(words / 200));

          if (!results || !results.issues) {
            return { words, chars, readingTime, total: 0, grammar: 0, style: 0 };
          }

          return {
            words,
            chars,
            readingTime,
            total: results.issues.length,
            grammar: results.issues.filter(i => i.type === 'grammar').length,
            style: results.issues.filter(i => i.type === 'style').length,
          };
        }, [text, results]);

        const filteredIssues = useMemo(() => {
          if (!results || !results.issues) return [];
          return results.issues.filter(issue => {
            if (activeTab === 'all') return true;
            if (activeTab === 'grammar') return issue.type === 'grammar';
            if (activeTab === 'style') return issue.type === 'style';
            return true;
          });
        }, [results, activeTab]);

        return (
          <div className="flex flex-col h-[100dvh] w-screen overflow-hidden bg-gray-50 dark:bg-gray-900">
            
            {/* Header Bar */}
            <header className="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-3 sm:px-6 flex justify-between items-center shadow-xs z-30 shrink-0">
              <div className="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
                <div className="bg-indigo-600 dark:bg-indigo-500 text-white p-2 sm:p-2.5 rounded-xl shadow-xs flex items-center justify-center shrink-0">
                  <img src="https://icons.getbootstrap.com/assets/icons/spellcheck.svg" className="h-4 w-4 sm:h-5 sm:w-5 filter invert" alt="GrammarCorrect Icon" />
                </div>
                <div className="truncate">
                  <h1 className="text-base sm:text-lg font-extrabold text-gray-900 dark:text-white tracking-tight truncate">
                    GrammarCorrect
                  </h1>
                </div>
              </div>

              <div className="flex items-center space-x-1.5 sm:space-x-3 shrink-0">
                
                {/* Tone Picker (Desktop Only) */}
                <div className="hidden lg:flex items-center space-x-1 bg-gray-100 dark:bg-gray-700/60 p-1 rounded-lg text-xs">
                  <span className="px-2 text-gray-500 dark:text-gray-400 font-medium">Tone:</span>
                  {['Professional', 'Casual', 'Academic', 'Creative'].map(t => (
                    <button
                      key={t}
                      onClick={() => setSettings(s => ({ ...s, tone: t }))}
                      className={`px-2 py-1 rounded-md transition-all font-medium ${
                        settings.tone === t 
                          ? 'bg-white dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 shadow-xs' 
                          : 'text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* Model Selector (Desktop Only) with Left Chevron Icon */}
                <div className="relative hidden lg:inline-flex items-center">
                  <div className="absolute left-2.5 pointer-events-none text-gray-500 dark:text-gray-400">
                    <Icons.ChevronDown className="h-3.5 w-3.5" />
                  </div>
                  <select 
                    value={settings.model}
                    onChange={(e) => setSettings(s => ({ ...s, model: e.target.value }))}
                    className="pl-7 pr-3 py-1.5 bg-gray-100 dark:bg-gray-700/80 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-600 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer appearance-none"
                  >
                    {MODEL_OPTIONS}
                  </select>
                </div>

                {!API_KEY && (
                  <input 
                    type="password" 
                    placeholder="API Key..." 
                    value={settings.apiKey}
                    onChange={(e) => setSettings(s => ({ ...s, apiKey: e.target.value }))}
                    className="text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-24 sm:w-28 hidden xl:block"
                  />
                )}

                <button 
                  onClick={() => setSettings(s => ({ ...s, darkMode: !s.darkMode }))}
                  className="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                  title="Toggle Dark/Light Mode"
                >
                  {settings.darkMode ? <Icons.Sun /> : <Icons.Moon />}
                </button>

                <button 
                  onClick={() => analyzeText()}
                  disabled={isAnalyzing || text.trim().length === 0}
                  className={`flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg font-semibold text-white text-xs sm:text-sm shadow-xs transition-all ${
                    isAnalyzing || text.trim().length === 0 
                      ? 'bg-indigo-400 dark:bg-indigo-600/50 cursor-not-allowed' 
                      : 'bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 hover:shadow-md'
                  }`}
                >
                  {isAnalyzing ? (
                    <>
                      <Icons.Loading />
                      <span className="hidden xs:inline">Scanning...</span>
                    </>
                  ) : (
                    <>
                      <Icons.Sparkles />
                      <span>Scan Text</span>
                    </>
                  )}
                </button>

                {/* Sidebar Toggle Button */}
                <button
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors relative"
                  title="Toggle Sidebar"
                >
                  <Icons.SidebarToggle />
                  {metrics.total > 0 && !sidebarOpen && (
                    <span className="absolute top-1 right-1 flex h-2.5 w-2.5">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                    </span>
                  )}
                </button>
              </div>
            </header>

            {/* Main Layout Workspace */}
            <div className="flex-1 flex overflow-hidden relative">
              
              {/* Editor Workspace (Left) */}
              <div className="flex-1 flex flex-col min-w-0 bg-white dark:bg-gray-900 relative">
                
                {/* Metric Header Bar */}
                <div className="h-11 px-3 sm:px-6 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-800/40 flex justify-between items-center text-xs text-gray-500 dark:text-gray-400 shrink-0 overflow-x-auto no-scrollbar gap-3">
                  <div className="flex items-center space-x-2 sm:space-x-3 shrink-0 whitespace-nowrap text-[11px] sm:text-xs">
                    <span><strong>{metrics.words}</strong> w</span>
                    <span>•</span>
                    <span><strong>{metrics.chars}</strong> ch</span>
                    <span>•</span>
                    <span><strong>{metrics.readingTime}</strong>m read</span>
                  </div>

                  <div className="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                    {results && results.issues && results.issues.length > 0 && (
                      <button
                        onClick={acceptAllFiltered}
                        className="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded-md transition-colors font-medium text-xs shadow-2xs whitespace-nowrap"
                        title="Correct all identified grammar & style issues"
                      >
                        <Icons.CheckDouble />
                        <span className="hidden xs:inline">Correct All</span>
                      </button>
                    )}

                    <button
                      onClick={generateSummary}
                      disabled={isSummarizing || !text.trim()}
                      className="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 rounded-md transition-colors font-medium whitespace-nowrap"
                      title="Generate AI Text Summary"
                    >
                      <Icons.DocumentText />
                      <span>{isSummarizing ? 'Summarizing...' : 'Summarize'}</span>
                    </button>

                    <button 
                      onClick={copyTextToClipboard}
                      className="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-md transition-colors text-gray-600 dark:text-gray-300 whitespace-nowrap"
                      title="Copy text"
                    >
                      <Icons.Copy />
                      <span className="hidden xs:inline">{copied ? 'Copied!' : 'Copy'}</span>
                    </button>

                    <button 
                      onClick={clearText}
                      className="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1 hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-600 dark:hover:text-red-400 rounded-md transition-colors text-gray-600 dark:text-gray-300 whitespace-nowrap"
                      title="Clear editor text"
                    >
                      <Icons.Trash />
                      <span className="hidden xs:inline">Clear</span>
                    </button>
                  </div>
                </div>

                {error && (
                  <div className="m-3 sm:m-4 bg-red-50 dark:bg-red-950/50 border-l-4 border-red-500 p-2.5 sm:p-3 rounded-r-lg flex justify-between items-center text-xs text-red-700 dark:text-red-300 shrink-0">
                    <span className="pr-2">{error}</span>
                    <button onClick={() => setError("")} className="hover:text-red-900 dark:hover:text-red-100 shrink-0">
                      <Icons.Close />
                    </button>
                  </div>
                )}

                {/* Text Canvas */}
                <div className="flex-1 p-4 sm:p-6 md:p-10 overflow-y-auto custom-scrollbar relative" onClick={handleEditorClick}>
                  <div 
                    id="editor-content"
                    ref={editorRef}
                    contentEditable="true"
                    onInput={handleEditorInput}
                    placeholder="Type, paste, or draft text here. GrammarCorrect will automatically analyze your entire document..."
                    className="w-full max-w-4xl mx-auto text-base sm:text-lg leading-relaxed text-gray-800 dark:text-gray-100 outline-none pb-24"
                    spellCheck="false"
                  ></div>
                </div>

                {/* Popover Inline Tooltip */}
                {activeTooltip && (
                  <div 
                    style={{ 
                      position: 'fixed', 
                      top: `${activeTooltip.top}px`, 
                      left: `${activeTooltip.left}px`,
                      zIndex: 60
                    }}
                    className="w-[calc(100vw-32px)] max-w-[320px] bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 p-3.5 sm:p-4 animate-pop-in text-xs"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className={`px-2 py-0.5 rounded-full font-bold uppercase text-[10px] tracking-wider ${
                        activeTooltip.issue.type === 'grammar' 
                          ? 'bg-red-100 dark:bg-red-950/80 text-red-700 dark:text-red-300' 
                          : 'bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300'
                      }`}>
                        {activeTooltip.issue.type === 'grammar' ? 'Grammar & Spelling' : 'Style & Tone'}
                      </span>
                      <button 
                        onClick={() => setActiveTooltip(null)} 
                        className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
                      >
                        <Icons.Close />
                      </button>
                    </div>

                    <div className="mb-3">
                      <div className="text-gray-400 dark:text-gray-500 line-through mb-1 font-mono">
                        "{activeTooltip.issue.originalText}"
                      </div>
                      <div className="flex items-center text-sm font-semibold text-green-600 dark:text-green-400 gap-1.5">
                        <Icons.ArrowRight />
                        <span>"{activeTooltip.issue.suggestion}"</span>
                      </div>
                    </div>

                    <p className="text-gray-600 dark:text-gray-300 mb-3 bg-gray-50 dark:bg-gray-900/60 p-2.5 rounded-lg border border-gray-100 dark:border-gray-700/50 leading-relaxed">
                      {activeTooltip.issue.explanation}
                    </p>

                    <div className="flex gap-2 pt-1">
                      <button 
                        onClick={() => acceptSuggestion(activeTooltip.issueId)}
                        className="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-1.5 px-3 rounded-lg flex items-center justify-center gap-1 transition-colors shadow-xs"
                      >
                        <Icons.Check />
                        <span>Apply Fix</span>
                      </button>
                      <button 
                        onClick={() => dismissIssue(activeTooltip.issueId)}
                        className="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 font-medium rounded-lg transition-colors"
                      >
                        Ignore
                      </button>
                    </div>
                  </div>
                )}

              </div>

              {/* Mobile Backdrop Overlay */}
              {sidebarOpen && (
                <div 
                  onClick={() => setSidebarOpen(false)}
                  className="fixed inset-0 bg-black/40 dark:bg-black/60 z-40 lg:hidden backdrop-blur-xs transition-opacity"
                />
              )}

              {/* Sidebar Drawer */}
              <div className={`fixed lg:relative top-0 right-0 h-full w-[88vw] max-w-[380px] lg:w-96 bg-white dark:bg-gray-800 border-l border-gray-200 dark:border-gray-700 flex flex-col z-50 lg:z-20 shrink-0 transition-transform duration-300 ease-in-out shadow-2xl lg:shadow-none ${
                sidebarOpen ? 'translate-x-0' : 'translate-x-full lg:hidden'
              }`}>
                
                {/* Score & Summary Card */}
                <div className="p-4 sm:p-5 border-b border-gray-200 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-800/60 flex items-center justify-between shrink-0">
                  <div className="space-y-1 pr-2">
                    <div className="flex items-center justify-between">
                      <h2 className="text-xs font-bold text-gray-400 dark:text-gray-400 uppercase tracking-wider">Document Rating</h2>
                    </div>
                    <p className="text-xs text-gray-600 dark:text-gray-300 max-w-[200px] leading-snug">
                      {results 
                        ? (dynamicScore === 100 ? "Your text is clean, clear, and ready to publish!" : results.summary) 
                        : "Scan your full text to review accuracy and tone quality."
                      }
                    </p>
                  </div>

                  <div className="flex items-center space-x-2 shrink-0">
                    <div className="relative h-12 w-12 sm:h-14 sm:w-14 flex items-center justify-center shrink-0">
                      <svg className="h-full w-full transform -rotate-90" viewBox="0 0 36 36">
                        <path
                          className="text-gray-200 dark:text-gray-700"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="3.5"
                        />
                        {dynamicScore !== null && (
                          <path
                            className={`transition-all duration-500 ${dynamicScore > 80 ? 'text-green-500' : dynamicScore > 60 ? 'text-amber-500' : 'text-red-500'}`}
                            strokeDasharray={`${dynamicScore}, 100`}
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                            fill="none"
                            stroke="currentColor"
                            strokeWidth="3.5"
                            strokeLinecap="round"
                          />
                        )}
                      </svg>
                      <span className="absolute text-sm sm:text-base font-extrabold text-gray-800 dark:text-gray-100">
                        {dynamicScore !== null ? dynamicScore : '--'}
                      </span>
                    </div>

                    <button
                      onClick={() => setSidebarOpen(false)}
                      className="p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 lg:hidden"
                      title="Close Sidebar"
                    >
                      <Icons.Close className="h-5 w-5" />
                    </button>
                  </div>
                </div>

                {/* Tab Navigation */}
                <div className="flex border-b border-gray-200 dark:border-gray-700 shrink-0 text-xs font-semibold overflow-x-auto no-scrollbar px-1 bg-white dark:bg-gray-800">
                  <button 
                    onClick={() => setActiveTab('all')}
                    className={`flex items-center gap-1.5 px-3 py-3 border-b-2 whitespace-nowrap transition-colors shrink-0 ${
                      activeTab === 'all' 
                        ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 font-bold' 
                        : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'
                    }`}
                  >
                    <span>All</span>
                    <span className="px-1.5 py-0.5 rounded-full bg-gray-100 dark:bg-gray-700 text-[10px] font-bold">{metrics.total}</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('grammar')}
                    className={`flex items-center gap-1.5 px-3 py-3 border-b-2 whitespace-nowrap transition-colors shrink-0 ${
                      activeTab === 'grammar' 
                        ? 'border-red-500 text-red-600 dark:text-red-400 font-bold' 
                        : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'
                    }`}
                  >
                    <span>Grammar</span>
                    <span className="px-1.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/60 text-red-600 dark:text-red-400 text-[10px] font-bold">{metrics.grammar}</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('style')}
                    className={`flex items-center gap-1.5 px-3 py-3 border-b-2 whitespace-nowrap transition-colors shrink-0 ${
                      activeTab === 'style' 
                        ? 'border-indigo-500 text-indigo-600 dark:text-indigo-400 font-bold' 
                        : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'
                    }`}
                  >
                    <span>Style</span>
                    <span className="px-1.5 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 text-[10px] font-bold">{metrics.style}</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('summary')}
                    className={`flex items-center gap-1 px-3 py-3 border-b-2 whitespace-nowrap transition-colors shrink-0 ${
                      activeTab === 'summary' 
                        ? 'border-emerald-500 text-emerald-600 dark:text-emerald-400 font-bold' 
                        : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'
                    }`}
                  >
                    <span>Summary</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('settings')}
                    className={`flex items-center gap-1.5 px-3 py-3 border-b-2 whitespace-nowrap transition-colors shrink-0 ${
                      activeTab === 'settings' 
                        ? 'border-indigo-600 text-indigo-600 dark:text-indigo-400 font-bold' 
                        : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'
                    }`}
                  >
                    <Icons.Cog className="h-3.5 w-3.5" />
                    <span>Settings</span>
                  </button>
                </div>

                {/* Tab Panel List */}
                <div className="flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-4 space-y-3 min-h-0 bg-gray-50/50 dark:bg-gray-900/40">
                  
                  {activeTab === 'settings' ? (
                    <div className="space-y-4 text-xs">
                      {/* Writing Tone Selector */}
                      <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-2xs space-y-2.5">
                        <label className="font-bold text-gray-900 dark:text-white uppercase tracking-wider text-[10px] text-indigo-500 block">
                          Writing Tone
                        </label>
                        <div className="grid grid-cols-2 gap-2">
                          {['Professional', 'Casual', 'Academic', 'Creative'].map(t => (
                            <button
                              key={t}
                              type="button"
                              onClick={() => setSettings(s => ({ ...s, tone: t }))}
                              className={`py-2 px-3 rounded-lg text-xs font-semibold transition-all border ${
                                settings.tone === t
                                  ? 'bg-indigo-50 dark:bg-indigo-950/60 border-indigo-500 text-indigo-600 dark:text-indigo-400'
                                  : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50'
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* AI Model Selector with Left Chevron */}
                      <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-2xs space-y-2.5">
                        <label className="font-bold text-gray-900 dark:text-white uppercase tracking-wider text-[10px] text-indigo-500 block">
                          AI Model
                        </label>
                        <div className="relative inline-flex items-center w-full">
                          <div className="absolute left-3 pointer-events-none text-gray-500 dark:text-gray-400">
                            <Icons.ChevronDown className="h-3.5 w-3.5" />
                          </div>
                          <select
                            value={settings.model}
                            onChange={(e) => setSettings(s => ({ ...s, model: e.target.value }))}
                            className="w-full py-2.5 pl-8 pr-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer appearance-none"
                          >
                            {MODEL_OPTIONS}
                          </select>
                        </div>
                      </div>

                      {/* API Key Input */}
                      <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-2xs space-y-2.5">
                        <label className="font-bold text-gray-900 dark:text-white uppercase tracking-wider text-[10px] text-indigo-500 block">
                          Google AI Studio API Key
                        </label>
                        <input
                          type="password"
                          placeholder="Enter your Gemini API key..."
                          value={settings.apiKey}
                          onChange={(e) => setSettings(s => ({ ...s, apiKey: e.target.value }))}
                          className="w-full text-xs border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <p className="text-[10px] text-gray-400 dark:text-gray-500 leading-relaxed">
                          Your key is saved locally in browser storage and directly connects with Google's API.
                        </p>
                      </div>
                    </div>
                  ) : activeTab === 'summary' ? (
                    <div className="space-y-4">
                      {!summaryData ? (
                        <div className="flex flex-col items-center justify-center h-64 text-center p-4 space-y-3">
                          <div className="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-full text-emerald-500">
                            <Icons.DocumentText />
                          </div>
                          <h3 className="text-sm font-semibold text-gray-800 dark:text-gray-200">No Summary Generated</h3>
                          <p className="text-xs text-gray-500 dark:text-gray-400">Click the button below to generate a comprehensive AI summary of your text.</p>
                          <button
                            onClick={generateSummary}
                            disabled={isSummarizing || !text.trim()}
                            className="mt-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-xs transition-colors"
                          >
                            {isSummarizing ? 'Generating Summary...' : 'Summarize Document'}
                          </button>
                        </div>
                      ) : (
                        <div className="space-y-4 text-xs">
                          <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-2xs">
                            <h3 className="font-bold text-gray-900 dark:text-white mb-2 uppercase tracking-wider text-[10px] text-indigo-500">Executive Summary</h3>
                            <p className="text-gray-700 dark:text-gray-300 leading-relaxed font-medium">
                              {summaryData.executiveSummary}
                            </p>
                          </div>

                          <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 shadow-2xs">
                            <h3 className="font-bold text-gray-900 dark:text-white mb-2 uppercase tracking-wider text-[10px] text-indigo-500">Key Takeaways</h3>
                            <ul className="space-y-2">
                              {summaryData.keyTakeaways?.map((item, idx) => (
                                <li key={idx} className="flex items-start gap-2 text-gray-700 dark:text-gray-300">
                                  <span className="text-indigo-500 font-bold">•</span>
                                  <span>{item}</span>
                                </li>
                              ))}
                            </ul>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-center">
                              <span className="text-[10px] font-bold text-gray-400 uppercase">Est. Read Time</span>
                              <div className="text-sm font-extrabold text-gray-800 dark:text-gray-100 mt-0.5">
                                {summaryData.estimatedReadingTime}
                              </div>
                            </div>
                            <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-center">
                              <span className="text-[10px] font-bold text-gray-400 uppercase">Tone Analysis</span>
                              <div className="text-sm font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5">
                                {summaryData.sentiment}
                              </div>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    <>
                      {filteredIssues.length > 0 && (
                        <div className="flex justify-between items-center pb-2 px-1">
                          <span className="text-[11px] font-bold text-gray-400 dark:text-gray-400 uppercase tracking-wider">
                            {filteredIssues.length} {filteredIssues.length === 1 ? 'Alert' : 'Alerts'}
                          </span>
                          
                          <button 
                            onClick={acceptAllFiltered}
                            className="text-xs text-white bg-green-600 hover:bg-green-700 font-semibold flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-colors shadow-2xs"
                          >
                            <Icons.CheckDouble />
                            <span>Correct All</span>
                          </button>
                        </div>
                      )}

                      {!results ? (
                        <div className="flex flex-col items-center justify-center h-64 text-gray-400 dark:text-gray-500 text-center p-4 space-y-3">
                          <div className="p-3 bg-indigo-50 dark:bg-indigo-950/40 rounded-full text-indigo-500">
                            <Icons.Wand />
                          </div>
                          <p className="text-xs leading-relaxed">Click "Scan Text" above to proofread your content for grammar, spelling, and tone consistency.</p>
                        </div>
                      ) : filteredIssues.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-64 text-center p-4 space-y-2">
                          <div className="p-3 bg-green-50 dark:bg-green-950/40 rounded-full text-green-500">
                            <Icons.Check className="h-6 w-6" />
                          </div>
                          <h3 className="text-sm font-semibold text-gray-800 dark:text-gray-200">No issues found</h3>
                          <p className="text-xs text-gray-500 dark:text-gray-400">Your text is clean, clear, and ready to send!</p>
                        </div>
                      ) : (
                        filteredIssues.map((issue) => (
                          <div 
                            key={issue.id} 
                            onClick={() => scrollToIssueInEditor(issue)}
                            className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/80 rounded-xl p-3 sm:p-3.5 shadow-2xs hover:shadow-md transition-all cursor-pointer group hover:border-indigo-300 dark:hover:border-indigo-600"
                          >
                            <div className="flex items-center justify-between mb-2">
                              <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                                issue.type === 'grammar' 
                                  ? 'bg-red-50 dark:bg-red-950/60 text-red-600 dark:text-red-400' 
                                  : 'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400'
                              }`}>
                                {issue.type === 'grammar' ? 'Grammar' : 'Style'}
                              </span>

                              <span className="text-[10px] text-gray-400 dark:text-gray-500 group-hover:text-indigo-500 font-semibold transition-colors">
                                Jump to word →
                              </span>
                            </div>

                            <div className="text-xs text-gray-400 dark:text-gray-500 line-through mb-1 font-mono bg-gray-50 dark:bg-gray-900/60 p-1.5 rounded">
                              "{issue.originalText}"
                            </div>

                            <div className="text-sm font-semibold text-green-600 dark:text-green-400 mb-2 flex items-center gap-1.5">
                              <Icons.ArrowRight />
                              <span>"{issue.suggestion}"</span>
                            </div>

                            <p className="text-xs text-gray-600 dark:text-gray-300 mb-3 leading-snug">
                              {issue.explanation}
                            </p>

                            <div className="flex space-x-2 pt-2 border-t border-gray-100 dark:border-gray-700/60">
                              <button 
                                onClick={(e) => { e.stopPropagation(); acceptSuggestion(issue.id); }}
                                className="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-1.5 rounded-lg text-xs transition-colors flex items-center justify-center gap-1"
                              >
                                <Icons.Check />
                                <span>Accept</span>
                              </button>
                              <button 
                                onClick={(e) => { e.stopPropagation(); dismissIssue(issue.id); }}
                                className="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-medium rounded-lg text-xs transition-colors"
                              >
                                Dismiss
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </>
                  )}
                </div>

                {/* Sidebar Footer */}
                <div className="p-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-center text-[11px] text-gray-400 dark:text-gray-500 shrink-0 font-medium">
                  Engine: <span className="font-semibold text-indigo-500">{settings.model}</span>
                </div>
              </div>

            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  <script src="https://replit-cdn.com/replit-pill/replit-pill.global.js" data-referral-code="r1h5un0351j1" data-repl-id="438fc542-1f41-4c89-8e71-a01f72feb76c"></script></body>
</html>
